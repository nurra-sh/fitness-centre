<header class="app-header">
    <div class="container header-inner">
        <a class="brand" routerLink="/">
            <img src="fitnesslogo.jpg" alt="Iron Pulse logo" />
            <span class="brand-text">Iron Pulse Fitness</span>
        </a>

        <nav class="nav">
            <a class="nav-link" routerLink="/plans" routerLinkActive="active">Абонементы</a>
            <a class="nav-link" routerLink="/my-membership" routerLinkActive="active">Мой абонемент</a>
            <a class="nav-link" routerLink="/about" routerLinkActive="active">О нас</a>
            <a class="nav-link" routerLink="/contact" routerLinkActive="active">Контакты</a>
             @if (isAdmin()) {
                <a class="nav-link" routerLink="/admin/dashboard" routerLinkActive="active">Админ-панель</a>
            }
        </nav>

        <div class="actions">
            @if (!isAuthenticated()) {
                <a routerLink="/login"><button pButton label="Sign in" severity="secondary" outlined="true">Войти</button></a>
            <a routerLink="/register"><button pButton label="Register">Зарегистрироваться</button></a>
            }
            @if (isAuthenticated()) {
                <button (click)="logout()" pButton label="Logout" severity="secondary" outlined="true">Выйти</button>
            } 
        </div>
    </div>
</header>
